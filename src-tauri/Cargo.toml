[package]
name = "phonemirror"
description = "Show your phone's screen on your PC. Free, no account, no watermark."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "phonemirror"

[lib]
name = "phonemirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gethostname = "1.1.0"
if-addrs = "0.15.0"
log = "0.4.35"
mdns-sd = "0.21.7"
phonemirror-core = { path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }

[build-dependencies]
tauri-build = "2.7.4"

[target."cfg(windows)".dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
xcap = "0.9.8"
