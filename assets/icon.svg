<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#6A3DF0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F0FF"/>
      <stop offset="1" stop-color="#C9D8FF"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <!-- laptop -->
  <rect x="210" y="300" width="520" height="350" rx="34" fill="#0F1B3D"/>
  <rect x="240" y="330" width="460" height="290" rx="14" fill="url(#screen)"/>
  <path d="M160 680 h620 a24 24 0 0 1 -24 40 h-572 a24 24 0 0 1 -24 -40z" fill="#0F1B3D"/>
  <!-- mirrored phone on laptop screen -->
  <rect x="425" y="350" width="120" height="250" rx="20" fill="#2F6BFF" opacity="0.9"/>
  <!-- phone -->
  <rect x="650" y="400" width="190" height="360" rx="38" fill="#FFFFFF" stroke="#0F1B3D" stroke-width="18"/>
  <rect x="680" y="440" width="130" height="270" rx="14" fill="#2F6BFF"/>
  <!-- waves -->
  <path d="M598 300 q60 -60 140 -40" stroke="#FFFFFF" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M640 220 q90 -70 190 -30" stroke="#FFFFFF" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
