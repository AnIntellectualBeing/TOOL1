[package]
name = "phonemirror-core"
description = "Platform-independent logic for PhoneMirror: adb pairing, mDNS discovery, engine arguments"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "macros", "rt", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
